<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人工势场航路规划展示</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="hd">
  <div class="wrap">
    <div class="hd-main">
      <div class="hd-title">人工势场航路规划</div>
    </div>
  </div>
</header>
<main class="wrap">

<!-- ============ 1 交互仿真台 ============ -->
<section id="sim">
  <h2><span class="no">1</span>交互仿真台</h2>

  <div class="sim-grid">

    <!-- 控制面板 -->
    <aside class="panel">
      <div class="pnl-block">
        <div class="pnl-h">任务场景</div>
        <div class="btn-row">
          <button class="btn" data-preset="slide1">参数条件 1</button>
          <button class="btn" data-preset="slide2">参数条件 2</button>
          <button class="btn" data-preset="reset">清空重设</button>
        </div>
      </div>

      <div class="pnl-block">
        <div class="pnl-h">算法参数</div>

        <div class="ctl" data-ctl="kAtt">
          <label>引力尺度因子 <i>K<sub>att</sub></i></label>
          <div class="ctl-in">
            <input type="range" data-range="kAtt" min="0" max="20" step="0.05">
            <input type="number" data-num="kAtt" step="0.05">
          </div>
        </div>

        <div class="ctl" data-ctl="dT">
          <label>引力距离因子 <i>d<sub>t</sub></i><span class="unit">km</span></label>
          <div class="ctl-in">
            <input type="range" data-range="dT" min="1" max="80" step="1">
            <input type="number" data-num="dT" step="1">
          </div>
        </div>

        <div class="ctl" data-ctl="kRep">
          <label>斥力尺度因子 <i>K<sub>rep</sub></i></label>
          <div class="ctl-in">
            <input type="range" data-range="kRep" min="0" max="500" step="0.25">
            <input type="number" data-num="kRep" step="0.25">
          </div>
        </div>

        <div class="ctl" data-ctl="dObs">
          <label>斥力距离因子 <i>d<sub>obs</sub></i><span class="unit">km</span></label>
          <div class="ctl-in">
            <input type="range" data-range="dObs" min="1" max="80" step="0.5">
            <input type="number" data-num="dObs" step="0.5">
          </div>
        </div>

        <div class="ctl" data-ctl="eta">
          <label>迭代步长 <i>&eta;</i><span class="unit">km/步</span></label>
          <div class="ctl-in">
            <input type="range" data-range="eta" min="0.005" max="1.5" step="0.005">
            <input type="number" data-num="eta" step="0.005">
          </div>
        </div>

        <div class="ctl" data-ctl="n">
          <label>斥力幂次因子 <i>n</i></label>
          <div class="ctl-in">
            <input type="range" data-range="n" min="1" max="4" step="1">
            <input type="number" data-num="n" step="1">
          </div>
        </div>

        <div class="ctl" data-ctl="maxDisp">
          <label>单步位移限幅<span class="unit">km/步</span></label>
          <div class="ctl-in">
            <input type="range" data-range="maxDisp" min="0.1" max="10" step="0.1">
            <input type="number" data-num="maxDisp" step="0.1">
          </div>
        </div>

        <div class="ctl" data-ctl="kv">
          <label>相对速度避让增益 <i>K<sub>v</sub></i></label>
          <div class="ctl-in">
            <input type="range" data-range="kv" min="0" max="300" step="5">
            <input type="number" data-num="kv" step="5">
          </div>
        </div>
      </div>

      <div class="pnl-block">
        <div class="pnl-h">公式与策略</div>
        <div class="ctl-c">
          <label>斥力公式</label>
          <select data-sel="mode">
            <option value="slide">含目标距离因子</option>
            <option value="khatib">Khatib（无目标因子）</option>
          </select>
        </div>
        <div class="ctl-c">
          <label>局部极小逃逸</label>
          <select data-sel="escape">
            <option value="none">关闭</option>
            <option value="tangent">切向逃逸力</option>
            <option value="random">随机扰动</option>
          </select>
        </div>
      </div>

      <div class="pnl-block">
        <div class="pnl-h">障碍物</div>
        <div class="obs-list" id="obsList"></div>
        <div class="btn-row">
          <button class="btn btn-blue" id="btnAddObs">添加障碍</button>
          <button class="btn" id="btnClearObs">清空障碍</button>
        </div>
        <p class="hint" id="addHint"></p>
      </div>

      <div class="pnl-block">
        <div class="pnl-h">显示选项</div>
        <label class="chk"><input type="checkbox" data-chk="vec"> 势场力矢量网格</label>
        <label class="chk"><input type="checkbox" data-chk="influence" checked> 斥力影响范围</label>
        <label class="chk"><input type="checkbox" data-chk="force"> 当前步受力箭头</label>
        <label class="chk"><input type="checkbox" data-chk="grid" checked> 坐标网格</label>
      </div>
    </aside>

    <!-- 舞台 -->
    <div class="stage">
      <div class="stage-head">
        <div class="stage-title" id="stageTitle">幻灯片任务 · 参数条件 1</div>
        <div class="stage-tools">
          <button class="btn btn-blue" id="btnPlay">▶ 播放路径动画</button>
          <button class="btn" id="btnStep">单步</button>
          <button class="btn" id="btnEnd">直达终点</button>
          <button class="btn" id="btnReplay">重算</button>
        </div>
      </div>

      <div class="canvas-box">
        <canvas id="stage"></canvas>
        <div class="legend">
          <span><i class="lg lg-start"></i>起点</span>
          <span><i class="lg lg-goal"></i>目标终点</span>
          <span><i class="lg lg-obs"></i>禁飞区</span>
          <span><i class="lg lg-path"></i>规划航路</span>
          <span><i class="lg lg-drone"></i>当前无人机</span>
        </div>
      </div>

      <div class="prog">
        <span class="prog-l">进程</span>
        <input type="range" id="progress" min="0" max="0" value="0" step="1">
        <span class="prog-v" id="progText">0 / 0</span>
        <span class="prog-l">动画速度</span>
        <input type="range" id="speed" min="1" max="600" value="60" step="1" class="speed">
      </div>

      <div class="readout" id="readout"></div>
    </div>
  </div>
</section>

<!-- ============ 2 势场可视化 ============ -->
<section id="field">
  <h2><span class="no">2</span>势场可视化</h2>
  <div class="seg" id="fieldSeg">
    <button class="seg-btn on" data-field="att">引力场 U<sub>att</sub></button>
    <button class="seg-btn" data-field="rep">斥力场 U<sub>rep</sub></button>
    <button class="seg-btn" data-field="total">合成势场 U</button>
  </div>
  <div class="field-grid">
    <figure class="card">
      <canvas id="field2d"></canvas>
    </figure>
    <figure class="card">
      <canvas id="field3d"></canvas>
    </figure>
  </div>
</section>

<!-- ============ 4 缺陷与改进 ============ -->
<section id="defects">
  <h2><span class="no">3</span>常见缺陷与对应改进</h2>
  <div class="def-list" id="defList"></div>
</section>

</main>

<script src="js/config.js"></script>

<script src="js/app.js"></script>
</body>
</html>
